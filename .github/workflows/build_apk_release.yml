name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle (Robust)
        # 1. Use --no-daemon to avoid background process overhead.
        # 2. Use --no-parallel to avoid worker contention on 2 vCPUs.
        # 3. Use -Dorg.gradle.jvmargs to strictly limit heap memory.
        # 4. Use --info to get maximum visibility if it fails again.
        run: |
          ./gradlew clean :app:assembleDebug -x test -x lint -x check --no-daemon --no-parallel --info --stacktrace \
          -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "O/L Guru Android App Release v1.0.${{ github.run_number }}"
          body: |
            ### 📱 O/L Guru Android App Official APK
            - **Status**: Ready to install
            - **Build Number**: ${{ github.run_number }}
            
            👇 **Download `app-debug.apk` directly below:**
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
