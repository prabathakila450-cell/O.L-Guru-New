name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Configure Swap Space (4GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Verify SDK Tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            sudo mkdir -p "$SDK_ROOT/licenses"
            yes | sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
            sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;36.0.0"
            sudo chmod -R a+rX "$SDK_ROOT/licenses" "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" 2>/dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT, relying on preinstalled SDK"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Prepare Environment & Debug Keystore
        run: |
          chmod +x gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          set -o pipefail
          if ! ./gradlew :app:assembleDebug -x test -x lint -x check --no-daemon --no-build-cache --max-workers=1 --stacktrace 2>&1 | tee gradle_build.log; then
            echo "================ EXACT ERROR SUMMARY ===================="
            grep -vE '^[[:space:]]*(at |\.\.\. [0-9]+ more)' gradle_build.log | tail -n 15 || true
            echo "================ COMPILER / BUILD ERRORS ================"
            grep -iE -A 2 '^(e: |.*OutOfMemory|.*StackOverflow|ERROR:|FAILURE:|> Task .* FAILED)' gradle_build.log | tail -n 30 || true
            echo "========================================================="
            exit 1
          fi

      - name: Upload Gradle Failure Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-failure-log
          path: gradle_build.log
          if-no-files-found: ignore

      - name: Verify APK Output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated at $APK_PATH"
            find app/build/outputs -type f || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OL-Guru-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "O/L Guru Android App Release v1.0.${{ github.run_number }}"
          body: |
            ### 📱 O/L Guru Android App Official APK
            - **Status**: Ready to install
            - **Build Number**: ${{ github.run_number }}
            
            #### 📥 Direct Download Instructions:
            1. Scroll down to the **Assets** section below.
            2. Click on **`app-debug.apk`** to download it directly.
            3. Open the file on your Android device to install.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
