name: Build and Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      # මෙම කොටසින් ස්වයංක්‍රීයව android ෆෝල්ඩරය නිවැරදිව සකසා ගනී
      - name: Organize Android Structure
        run: |
          mkdir -p android
          mv app gradle build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat android/ 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK with Gradle
        run: flutter build apk --debug
