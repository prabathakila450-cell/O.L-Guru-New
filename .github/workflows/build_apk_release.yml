name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure .env file
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Setup debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools" || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"
          JAVA_OPTS: "-Xmx4096m"
        run: |
          ./gradlew assembleDebug -x test --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OL-Guru-App-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: steps.find_apk.outputs.apk_path != ''
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "O/L Guru App Release v1.0.${{ github.run_number }}"
          body: |
            ### 📱 O/L Guru Android App Official APK
            - **Status**: Ready to install
            - **Build Number**: ${{ github.run_number }}
            
            #### How to Install:
            1. Download the `app-debug.apk` file below under **Assets**.
            2. Transfer or open on your Android device.
            3. Tap **Install** (Allow installation from unknown sources if prompted).
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
