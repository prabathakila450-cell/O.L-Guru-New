name: Get SHA-1 Fingerprint

on: [push, workflow_dispatch]

jobs:
  get-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks

      - name: Get SHA-1
        run: |
          keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
